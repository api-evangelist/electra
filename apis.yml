aid: electra
name: Electra
description: 'Electra (legal name Electrasteel, Inc.) is a Boulder, Colorado clean-industrial
  company founded in 2020 that is reinventing ironmaking. Instead of smelting iron
  ore with fossil fuels in a blast furnace, Electra uses an electrochemical process
  — an acidic leach plus electrowinning driven by renewable electricity — to dissolve
  a broad range of iron ores, including low-grade and previously uncommercialized
  ores, and plate out 99% pure iron at roughly 60°C while recovering high-value co-minerals
  and emitting oxygen. The modular design lets units be added as building blocks for
  rapid scaling and lets the process follow intermittent renewable power. Electra has
  raised over $200M from Rio Tinto, BHP Ventures, POSCO, Breakthrough Energy Ventures,
  Amazon''s Climate Pledge Fund, Capricorn and Lowercarbon Capital, runs a pilot plant
  in Boulder, and is building a demonstration plant in Colorado. It is an industrial
  manufacturer with no public developer program: as of this profile it publishes no
  API, developer portal, documentation, machine-readable specification, or /.well-known
  discovery surface.'
